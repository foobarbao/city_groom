[project]
name = "city-groom-backend"
version = "0.1.0"
description = "City Groom backend: REST API, administration and simulators."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Django 5.2 is an LTS release; see "Versions" in backend/README.md for why
    # it is preferred over the latest 6.x release.
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.18.3,<3.19",
    "djangorestframework-gis>=1.3.0,<1.4",
    "drf-spectacular>=0.30.0,<0.31",
    "django-environ>=0.14.0,<0.15",
    "django-cors-headers>=4.9.0,<5",
    "psycopg[binary]>=3.3.6,<3.4",
    "whitenoise>=6.12.0,<7",
    "gunicorn>=26.2.0,<27",
    "django-stubs-ext>=5.2,<5.3",
    "djangorestframework-api-key>=3.1.0,<3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
    # The compatible-mypy extra pins a mypy release supported by the stubs.
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "DJ",       # flake8-django
    "S",        # flake8-bandit (security)
    "D",        # pydocstyle: public code must be documented
]
ignore = [
    "D104",     # package __init__ files carry no logic
    "D106",     # nested Meta classes are self-explanatory
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311", "D"]   # asserts and seeded randomness are fine in tests; test names document intent
"manage.py" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "rest_framework_gis.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = [
    # WhiteNoise warns when `collectstatic` has not been run; tests do not
    # serve static files.
    "ignore:No directory at:UserWarning",
]

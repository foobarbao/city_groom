# Frontend CI: lint, format, type check, tests and build of the customer app on
# every pull request touching the frontends (CODING_STANDARDS.md §8).
name: Frontend

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

jobs:
  customer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
